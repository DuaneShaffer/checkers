<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Scene harness</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg-0: #0c0b0a;
        --brass: #c9a45c;
        --text: #f3ede2;
        --text-2: #b5aa99;
      }
      html, body { margin: 0; height: 100%; overscroll-behavior: none; }
      body {
        background: radial-gradient(ellipse 80% 70% at 50% 46%, rgba(64, 44, 28, 0.55), transparent 70%), var(--bg-0);
        color: var(--text);
        font: 13px/1.3 system-ui, sans-serif;
        overflow: hidden;
      }
      #stage { position: fixed; inset: 0; }
      #ui { position: fixed; inset: 0; pointer-events: none; display: grid; }
      #ui > * { pointer-events: auto; }
      #ui[data-layout='full'] { grid-template: 'board' 1fr / 1fr; }
      #ui[data-layout='portrait'] { grid-template: 'top' 84px 'board' 1fr 'bottom' 132px / 1fr; }
      #ui[data-layout='rails'] { grid-template: 'left board right' 1fr / 132px 1fr 132px; }
      #ui[data-layout='panel'] { grid-template: 'board side' 1fr / 1fr clamp(300px, 26vw, 380px); }
      .slot { grid-area: board; pointer-events: none !important; }
      .slot.outline { outline: 1px dashed rgba(201, 164, 92, 0.6); outline-offset: -1px; }
      .bar { background: rgba(26, 23, 20, 0.72); border: 1px solid rgba(255, 240, 220, 0.08); }
      .controls {
        position: fixed; left: 8px; bottom: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px;
        pointer-events: auto; z-index: 2;
      }
      .controls.hidden button:not(#toggle-controls) { display: none; }
      button {
        font: inherit; color: var(--text); background: rgba(26, 23, 20, 0.85); border: 1px solid rgba(201, 164, 92, 0.45);
        border-radius: 10px; padding: 8px 10px; min-height: 36px; cursor: pointer;
      }
      button[aria-pressed='true'] { background: rgba(201, 164, 92, 0.3); }
      #status {
        position: fixed; top: 8px; left: 8px; z-index: 2; font-family: ui-monospace, monospace; font-size: 11px;
        color: var(--text-2); background: rgba(0, 0, 0, 0.35); padding: 4px 6px; border-radius: 6px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui" data-layout="full">
      <div class="bar" data-area="top" style="grid-area: top; display: none"></div>
      <div class="bar" data-area="bottom" style="grid-area: bottom; display: none"></div>
      <div class="bar" data-area="left" style="grid-area: left; display: none"></div>
      <div class="bar" data-area="right" style="grid-area: right; display: none"></div>
      <div class="bar" data-area="side" style="grid-area: side; display: none"></div>
      <div id="slot" class="slot"></div>
    </div>
    <div id="status"></div>
    <div class="controls" id="controls">
      <button id="toggle-controls">☰</button>
      <button id="step">Step</button>
      <button id="auto" aria-pressed="false">Autoplay</button>
      <button id="reset">Reset</button>
      <button id="undo">Undo (sync)</button>
      <button id="flip">Flip</button>
      <button id="recenter">Recenter</button>
      <button id="layout">Layout: full</button>
      <button id="outline" aria-pressed="false">Slot outline</button>
      <button id="hl">Highlights demo</button>
      <button id="kings">Kings demo</button>
      <button id="captures">Captures demo</button>
      <button id="instant" aria-pressed="false">Instant</button>
      <button id="quality">Quality: auto</button>
    </div>
    <script type="module" src="./scene.ts"></script>
  </body>
</html>
